<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome Back 👀</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
    }

    .blur-bg {
        position: fixed;
        width: 100%;
        height: 100%;
        backdrop-filter: blur(0px);
        transition: backdrop-filter 0.5s ease;
        z-index: 1;
    }

    .blur-active {
        backdrop-filter: blur(12px);
    }

    .card {
        position: relative;
        z-index: 2;
        backdrop-filter: blur(15px);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 50px;
        text-align: center;
        color: #e2e8f0;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
        animation: fadeIn 1s ease, float 3s ease-in-out infinite alternate;
        transition: transform 0.3s ease;
    }

    h1 { font-size: 32px; }
    #text { color: #94a3b8; margin-bottom: 30px; }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    button {
        padding: 12px 28px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        transition: 0.25s;
    }

    #yes {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
    }

    #yes:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 10px 25px rgba(34,197,94,0.4);
    }

    #no {
        background: #334155;
        color: #e2e8f0;
        position: relative;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
        from { transform: translateY(0); }
        to { transform: translateY(-10px); }
    }

    .fade-out {
        animation: fadeOut 0.6s forwards;
    }

    @keyframes fadeOut {
        to { opacity: 0; transform: scale(0.9); }
    }

    .success {
        animation: popIn 0.8s ease;
    }

    @keyframes popIn {
        from { opacity: 0; transform: scale(0.5); }
        to { opacity: 1; transform: scale(1); }
    }

    /* Cursor glow */
    .cursor {
        position: fixed;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: rgba(255,255,255,0.6);
        pointer-events: none;
        z-index: 3;
        transition: transform 0.1s ease;
    }
    .hint {
        margin-top: 15px;
        font-size: 12px;
        color: rgba(255,255,255,0.3);
        letter-spacing: 1px;
    }
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="blur-bg" id="blur"></div>
<div class="cursor" id="cursor"></div>

<div class="card" id="card">
    <h1 id="heading"></h1>
    <p id="text"></p>

    <div class="buttons">
        <button id="yes" onclick="yesClicked()">YES 😌</button>
        <button id="no" onmouseover="moveButton()">NO 😶</button>
    </div>
    <p class="hint">( don’t try to click NO )</p>
</div>

<script>
// Typing
let msg = "Welcome back pookie...";
let i = 0;
function type() {
    if (i < msg.length) {
        heading.innerHTML += msg[i++];
        setTimeout(type, 35);
    } else {
        text.innerText = "did you miss me? 👀";
    }
}
type();

// Cinematic YES
function yesClicked() {
    blur.classList.add("blur-active");
    card.style.transform = "scale(1.08)";

    setTimeout(() => card.classList.add("fade-out"), 200);

    setTimeout(() => {
        document.body.innerHTML = `
            <div class="blur-bg blur-active"></div>
            <div class="card success">
                <h1>Hmmm Good Girl 😌❤️</h1>
                <p>I really missed you :)</p>
            </div>
        `;
    }, 700);
}

// NO escape
function moveButton() {
    no.style.position = "absolute";
    no.style.left = Math.random() * (innerWidth - 120) + "px";
    no.style.top = Math.random() * (innerHeight - 60) + "px";
}

// Particle background
const c = bg.getContext("2d");
bg.width = innerWidth;
bg.height = innerHeight;

let p = Array.from({length:60},()=>({
    x:Math.random()*bg.width,
    y:Math.random()*bg.height,
    dx:(Math.random()-0.5),
    dy:(Math.random()-0.5),
    r:Math.random()*2
}));

function draw(){
    c.clearRect(0,0,bg.width,bg.height);
    p.forEach(a=>{
        a.x+=a.dx; a.y+=a.dy;
        c.beginPath();
        c.arc(a.x,a.y,a.r,0,6.28);
        c.fillStyle="rgba(255,255,255,0.5)";
        c.fill();
    });
    requestAnimationFrame(draw);
}
draw();

// Cursor glow
document.addEventListener("mousemove", e=>{
    cursor.style.left = e.clientX+"px";
    cursor.style.top = e.clientY+"px";
});
</script>

</body>
</html>
