<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mr genie Cat 👀</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1f2937, #111827);
        color: #e5e7eb;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
    }

    h1 {
        font-size: 36px;
        margin-bottom: 10px;
        font-weight: 600;
    }

    #text {
        font-size: 18px;
        color: #9ca3af;
        margin-bottom: 30px;
    }

    .buttons {
        display: flex;
        gap: 20px;
    }

    button {
        padding: 12px 28px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.25s;
    }

    #yes {
        background: #10b981;
        color: white;
    }

    #yes:hover {
        background: #059669;
    }

    #no {
        background: #374151;
        color: #e5e7eb;
        position: relative;
    }

    #no:hover {
        background: #4b5563;
    }
</style>
</head>

<body>

<h1 id="heading"></h1>
<p id="text"></p>

<div class="buttons">
    <button id="yes" onclick="yesClicked()">YES 😌</button>
    <button id="no" onmouseover="moveButton()">NO 😶</button>
</div>

<script>
// Typing effect
let message = "Question for YOU...";
let i = 0;

function typeEffect() {
    if (i < message.length) {
        document.getElementById("heading").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeEffect, 50);
    } else {
        document.getElementById("text").innerText = "do you wanna be my wife? 🙃👀";
    }
}

typeEffect();

// YES clicked
function yesClicked() {
    document.body.innerHTML = `
        <h1>Good Girl 😌❤️</h1>
        <p>yesssssss thats it ;)</p>
    `;
}

// NO button escapes
function moveButton() {
    let button = document.getElementById("no");

    button.style.position = "absolute";

    let x = Math.random() * (window.innerWidth - 120);
    let y = Math.random() * (window.innerHeight - 60);

    button.style.left = x + "px";
    button.style.top = y + "px";
}
</script>

</body>
</html>
